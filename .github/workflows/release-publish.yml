# Stage 3 of 3: publish the release that the release PR just landed.
#
# Runs on the merge commit, which already contains the version in package.json
# and the notes in CHANGES.md. semantic-release therefore tags and publishes a
# commit that genuinely contains the version it claims, which is what makes the
# git tag and the npm provenance attestation trustworthy.
name: Cli-core Release Publish

on:
  workflow_call:
    outputs:
      tag-name:
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  id-token: write
  contents: write

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  release:
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    permissions:
      contents: read
      id-token: write
    outputs:
      tag-name: ${{ steps.semantic-release.outputs.TAG_NAME }}
      change-log: ${{ steps.oai-changelog.outputs.change-log }}
      version-type: ${{ steps.oai-changelog.outputs.version-type }}
    steps:
      - name: Checkout cli-core repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Needed to find the previous tag and the api-definitions commit.
          fetch-depth: 0
      - run: make install
      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check package.json still matches the version to be released
        run: |
          fileName="$GITHUB_WORKSPACE/.github/scripts/verify-release-version.js"
          node -e "require('$fileName').verifyReleaseVersion().catch(e => { console.error(e.message); process.exit(1); })"
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Recover the api-definitions changelog for the release notes
        id: oai-changelog
        run: bash .github/scripts/oai-changelog-for-release.sh

      - name: semanticRelease
        id: semantic-release
        run: DEBUG=semantic-release:* npx semantic-release -t \${version}
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true # required for OIDC

      - name: verify release happened
        if: ${{ steps.semantic-release.outputs.TAG_NAME == '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9
        with:
          script: |
            core.setFailed('The release PR merged but semantic-release published nothing.')

      - name: Update release
        if: ${{ steps.oai-changelog.outputs.change-log != '' }}
        # Appends the api-definitions changelog to the notes that
        # @semantic-release/github wrote. Uses REPO_ACCESS_TOKEN because this
        # job runs with contents: read, so GITHUB_TOKEN cannot PATCH a release.
        run: |
          fileName="$GITHUB_WORKSPACE/.github/scripts/update-release.js"
          node -e "require('$fileName').updateRelease()"
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          TAG_NAME: ${{ steps.semantic-release.outputs.TAG_NAME }}
          RELEASE_BODY: ${{ steps.oai-changelog.outputs.change-log }}
          REPO_NAME: ${{ github.repository }}

  post-build-checks:
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    permissions:
      contents: read
      id-token: write
    needs: [ release ]
    steps:
      - name: Clone twilio-cli repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: '${{ github.repository_owner }}/twilio-cli'
      - name: Update cli-core version and run tests
        run: |
          node .github/scripts/update-cli-core-release-version.js
          make install
          make test
        env:
          REPO_NAME: ${{ github.repository_owner }}/twilio-cli
          CLI_CORE_TAG: ${{ needs.release.outputs.tag-name }}

  triggerCliWorkflow:
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    permissions:
      contents: read
      id-token: write
    needs: [ release, post-build-checks ]
    steps:
      - name: Checkout cli-core repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: make install
      - name: Invoke CLI workflow with changelog and version-type
        run: |
          fileName="$GITHUB_WORKSPACE/.github/scripts/trigger-workflow.js"
          node -e "require('$fileName').triggerWorkflow()"
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          WORKFLOW_NAME: 'release.yml'
          BRANCH_NAME: main
          REPO_NAME: ${{ github.repository_owner }}/twilio-cli
          INPUTS: '{ "change-log": ${{ toJSON(needs.release.outputs.change-log) }}, "version-type": "${{ needs.release.outputs.version-type }}", "homebrew-branch": "main", "homebrew-prerelease": "false", "tag-name": "${{ needs.release.outputs.tag-name }}" }'
