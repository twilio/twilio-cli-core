  test:
    needs: [ cli-token-validation ]
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: [ 22.x, lts/* ]
    steps:
      - name: Checkout cli-core repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@23b656b843d2a3461cf38e4fd466c07a822d5fc0 # v1
      - run: make install
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Run tests
        run: make test
  update-api-specs:
    runs-on: ubuntu-x64
    if: github.repository_owner == 'twilio'
    permissions:
      contents: read
      id-token: write
    needs: [ test ]
    outputs:
      change-log: ${{ steps.update-specs.outputs.change-log }}
      version-type: ${{ steps.update-specs.outputs.version-type }}
      spec-pr-opened: ${{ steps.update-specs.outputs.spec-pr-opened }}
    steps:
      - name: Create temporary folder for copying json files from OAI repo
        run: mkdir -p ~/oai_definitions/json
      - name: Checkout OAI repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: '${{ github.repository_owner }}/twilio-oai'
          token:  ${{ secrets.REPO_ACCESS_TOKEN }}
      - run: |
          cp -R spec/json/. ~/oai_definitions/json/
          cp -R CHANGES.md ~/oai_definitions/CHANGES.md
      - name: Checkout cli-core repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token:  ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Update OAI specs
        id: update-specs
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          make install
          cp -R ~/oai_definitions/CHANGES.md OAI_CHANGES.md
          bash .github/scripts/update-api-spec-with-changelog.sh
  # When there was nothing new to propose, main is already up to date and we go
  # straight to preparing the release PR. When a spec PR *was* opened, that
  # happens instead from release-on-spec-merge.yml once the spec PR merges.
  prepare-release:
    needs: [ update-api-specs ]
    if: needs.update-api-specs.outputs.spec-pr-opened == 'false'
    uses: ./.github/workflows/release-prepare.yml
    secrets: inherit
    with:
      change-log: ${{ needs.update-api-specs.outputs.change-log }}

  summarize:
    needs: [ update-api-specs ]
    if: needs.update-api-specs.outputs.spec-pr-opened == 'true'
    runs-on: ubuntu-x64
    steps:
      - name: Explain what happens next
        run: |
          {
            echo "### twilio-oai def PR opened"
            echo
            echo "The branch ruleset on \`main\` requires changes to go through a pull request,"
            echo "so the specs were proposed as a PR instead of pushed."
            echo
            echo "**The release has not run yet.** Approve and merge that PR and the"
            echo "\`Cli-core Release On Spec Merge\` workflow will open the release PR."
          } >> "$GITHUB_STEP_SUMMARY"

